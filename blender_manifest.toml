# Blender extension manifest. Blender 4.2 and later read this file instead of the
# old bl_info dictionary in __init__.py, and it is what the official extensions
# catalogue uses to list and install the add-on.
#
# Validated with Blender's own reader, which is not the same thing as reading it
# with ours:
#
#     blender --command extension validate .
#
# That command found four mistakes in earlier versions of this file that our own
# checker had passed: a tagline over the 64-character limit (twice, because the
# first fix was one character short), a permission description written as prose
# when the field is capped at 64 characters, platforms written as a list of
# tables when the schema wants a list of strings, and — the one worth remembering
# — ``platforms`` placed after ``[permissions]``, where TOML silently files it
# *inside* that table. Every one of these would have been a rejected upload.
#
# 0.1.2 is the version the catalogue asked for in review (20.10.2026):
#
#   * ``platforms`` removed — the catalogue builds the per-platform archives itself,
#     and a hand-written list only gets in the way of that. The add-on is pure
#     Python and has no compiled parts, so there is nothing platform-specific to
#     declare.
#   * ``tags`` reduced to the single category the reviewer allowed.
#
# Both changes are metadata only. No code changed between 0.1.1 and 0.1.2.

schema_version = "1.0.0"

id = "fbxscale"
name = "FBX Scale Report"
version = "0.2.0"
# 60 characters, against a limit of 64. The count is written down because it has
# already been wrong twice: wording improves, and the limit does not move.
#
# Worth revisiting in the next release, together with the name: this line is what a
# search result shows under the title, and it contains none of the words somebody
# with the problem types ("wrong", "too small", "Unity"). The listing description
# can be edited on the platform without a release; this cannot.
tagline = "See the unit scale an FBX declares, before the engine does"
type = "add-on"

maintainer = "Quiet Tools Studio"
license = ["SPDX:GPL-3.0-or-later"]

# The extension's own page. Blender shows this as the add-on's homepage, and it is the
# only place the catalogue's rules allow a pointer to the studio's site — advertising
# inside the Blender UI is forbidden (Terms of Service 6.1/6.3), and the listing may
# only describe what the free edition does (6.2).
website = "https://quiettoolsstudio.com/"

# Blender 4.2 is the first release that reads this manifest format, so that is
# the floor whether we like it or not. 4.2 is also the first LTS with extensions.
blender_version_min = "4.2.0"

# One category only, as the reviewer asked. The catalogue files an add-on by what it
# is for, and this one is an import/export tool; "Mesh" and "Development" described
# the implementation rather than the job, and a listing in three categories is harder
# to find, not easier.
tags = ["Import-Export"]

# The catalogue shows this text to the user before installation, so it is written
# for a reader rather than for a schema. Allowed permission keys are files,
# clipboard, microphone, network and camera; the value is capped at 64
# characters.
[permissions]
files = "Reads FBX files; writes a report only where asked"

# What goes into the built zip. Without this section, Blender's builder packs
# **every** file in the folder — which on the first attempt included the examples
# in ``dist/``, the whole test suite, the build scripts, and a copy of a
# previously built zip nested inside the new one. 145 KB of files for a 31 KB
# add-on.
#
# An explicit list rather than an exclusion pattern, on purpose: a list can only
# be wrong by omission, and an omission shows up as an ImportError on the first
# run. An exclusion pattern fails by quietly shipping something.
[build]
paths = [
  "__init__.py",
  "ui.py",
  "core/__init__.py",
  "core/fbx.py",
  "core/scan.py",
  "core/cli.py",
  "icons/icon-16.png",
  "icons/icon-32.png",
  "icons/icon-64.png",
  "icons/icon-128.png",
  "README.md",
  "LICENSE",
]
